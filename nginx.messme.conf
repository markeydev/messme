# Messme — nginx site config
# Deploy: sudo cp nginx.messme.conf /etc/nginx/sites-enabled/messme.conf
#         sudo nginx -t && sudo systemctl reload nginx

# Helper map for WebSocket Connection header upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTPS ──────────────────────────────────────────────────────────────────────
server {
    server_name aty-market.ru www.aty-market.ru;

    # Large uploads: voice (10 MB), images (20 MB), video notes (50 MB), files (100 MB)
    client_max_body_size 110m;

    # Keep WebSocket connections alive
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # ── WebSocket server (socket.io at /ws) ─────────────────────────────────
    location /ws {
        proxy_pass         http://localhost:3003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Next.js app ──────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/aty-market.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aty-market.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# ── HTTP → HTTPS redirect (managed by Certbot, keep as-is) ────────────────────
server {
    if ($host = www.aty-market.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = aty-market.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name aty-market.ru www.aty-market.ru;
    return 404;
}
