# coturn TURN server configuration for Messme
# Credentials are passed via --user flag in docker-compose command

# Listening ports
listening-port=3478
tls-listening-port=5349

# Realm (typically your domain)
realm=aty-market.ru

# Relay port range for media streams
min-port=49152
max-port=65535

# Security
fingerprint
lt-cred-mech

# Allow relay between two allocations on the same TURN server (hair-pinning).
# Without this, when both peers use this TURN server, packets from one relay
# to another relay on the same server are silently dropped.
allow-loopback-peers

# Logging
verbose

# Disable old/insecure protocols
no-tlsv1
no-tlsv1_1
